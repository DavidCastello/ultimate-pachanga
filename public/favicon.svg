    <path d="M26.42 39.69L14.95 55.46" />
    <path d="M22.96 29.06L4.42 23.04" />
  </g>

  <circle
    cx="32"
    cy="32"
    r="29"
    fill="none"
    stroke="#111827"
    stroke-width="3"
  />
</svg>
