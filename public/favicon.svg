<!--
  Browser tab icon.

  A truncated icosahedron flattened onto a disc: one pentagon in the middle,
  five more opposite its edges, seams joining them. The outer pentagons sit past
  the rim and are clipped by it, which is what gives them the half-visible look
  a real ball has in silhouette.

  White with dark markings, so it reads on a light and a dark tab strip alike.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>
  <clipPath id="ball">
    <circle cx="32" cy="32" r="29" />
  </clipPath>

  <circle cx="32" cy="32" r="29" fill="#ffffff" />

  <g clip-path="url(#ball)" fill="#111827">
    <path d="M32 22.5L41.04 29.06L37.58 39.69L26.42 39.69L22.96 29.06Z" />
    <path d="M45.52 13.39L42.25 3.33L50.81 -2.89L59.37 3.33L56.1 13.39Z" />
    <path d="M53.87 39.11L62.43 32.89L70.99 39.11L67.72 49.17L57.14 49.17Z" />
    <path d="M32 55L40.56 61.22L37.29 71.28L26.71 71.28L23.44 61.22Z" />
    <path d="M10.13 39.11L6.86 49.17L-3.72 49.17L-6.99 39.11L1.57 32.89Z" />
    <path d="M18.48 13.39L7.9 13.39L4.63 3.33L13.19 -2.89L21.75 3.33Z" />
  </g>

  <g
    clip-path="url(#ball)"
    stroke="#111827"
    stroke-width="2.2"
    stroke-linecap="round"
  >
    <path d="M32 22.5L32 3" />
